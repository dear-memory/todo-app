<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>할일장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=6">
</head>
<body>
  <div id="authOverlay" class="auth-overlay">
    <div class="auth-box">
      <p class="logo" style="text-align:center; margin-bottom:1.5rem;">할일장</p>
      <div class="auth-tabs">
        <button type="button" class="auth-tab active" id="tabLogin" data-mode="login">로그인</button>
        <button type="button" class="auth-tab" id="tabSignup" data-mode="signup">회원가입</button>
      </div>
      <form id="authForm">
        <input type="email" id="authEmail" placeholder="이메일" required autocomplete="email">
        <input type="password" id="authPassword" placeholder="비밀번호 (6자 이상)" required autocomplete="current-password">
        <p class="field-error" id="authError" hidden></p>
        <button type="submit" class="submit-btn" id="authSubmitBtn">로그인</button>
      </form>
      <button type="button" class="forgot-link" id="forgotLink">비밀번호를 잊으셨나요?</button>
      <p class="auth-note" id="authNote"></p>
    </div>
  </div>

  <div class="app" id="appRoot" hidden>
    <aside class="sidebar">
      <p class="logo">할일장</p>
      <nav>
        <button class="nav-item active" data-view="today">
          <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.2" y1="4.2" x2="5.6" y2="5.6"/><line x1="18.4" y1="18.4" x2="19.8" y2="19.8"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.2" y1="19.8" x2="5.6" y2="18.4"/><line x1="18.4" y1="5.6" x2="19.8" y2="4.2"/></svg>
          오늘
        </button>
        <button class="nav-item" data-view="week">
          <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          이번 주
        </button>
        <button class="nav-item" data-view="worklist">
          <svg class="icon" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          작업 목록
        </button>
        <button class="nav-item" data-view="notes">
          <svg class="icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          메모
        </button>
      </nav>

      <div class="sidebar-footer">
        <p class="sync-note" id="syncNote" hidden></p>
        <p class="sidebar-email" id="sidebarEmail"></p>
        <button type="button" class="logout-btn" id="logoutBtn">로그아웃</button>
      </div>
    </aside>

    <main class="main">
      <div id="view-today">
        <div class="date-nav">
          <button type="button" class="date-nav-btn" id="prevDayBtn" aria-label="이전 날짜">
            <svg class="icon" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <div class="date-nav-center">
            <p class="date" id="todayDate"></p>
            <input type="date" id="datePicker" class="date-picker">
          </div>
          <button type="button" class="date-nav-btn" id="nextDayBtn" aria-label="다음 날짜">
            <svg class="icon" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
          <button type="button" class="today-btn" id="todayBtn">오늘로</button>
        </div>
        <p class="subtitle" id="taskCountLabel"></p>

        <section id="listSections"></section>

        <p class="empty-state" id="emptyState" hidden>이 날짜엔 할 일이 없어요. 오른쪽에서 하나 추가해보세요.</p>
      </div>

      <div id="view-week" hidden>
        <p class="date" id="weekRangeLabel">이번 주</p>
        <p class="subtitle">날짜를 누르면 그날의 오늘 화면으로 이동해요.</p>
        <div id="weekGrid" class="week-grid"></div>
      </div>

      <div id="view-worklist" hidden>
        <p class="date">작업 목록</p>
        <p class="subtitle">날짜에 상관없이 진행 중인 업무를 모아두는 곳이에요.</p>

        <form id="worklistForm" class="worklist-form">
          <input type="text" id="worklistInput" placeholder="새 업무를 입력하세요" required>
          <button type="submit">추가</button>
        </form>
        <p class="field-error" id="worklistError" hidden>업무 내용을 입력해주세요.</p>

        <div id="worklistItems"></div>
        <p class="empty-state" id="worklistEmpty" hidden>등록된 업무가 없어요.</p>
      </div>

      <div id="view-notes" hidden>
        <p class="date">메모</p>
        <p class="subtitle">자유롭게 적어두는 공간이에요. 입력하면 자동으로 저장됩니다.</p>
        <textarea id="notesArea" placeholder="여기에 메모를 적어보세요."></textarea>
      </div>
    </main>

    <aside class="side-panel" id="sidePanel">
      <div class="progress-card">
        <p class="progress-label">진행률</p>
        <p class="progress-value" id="progressValue">0 / 0</p>
      </div>
      <p class="encourage" id="encourageText"></p>

      <div class="divider"></div>

      <form id="addForm">
        <p class="form-title">새 할 일</p>
        <input type="text" id="titleInput" placeholder="무엇을 해야 하나요?" required>
        <p class="field-error" id="titleError" hidden>할 일을 입력해주세요.</p>

        <div class="toggle-row">
          <span>시간 설정</span>
          <label class="toggle">
            <input type="checkbox" id="timeToggle">
            <span class="toggle-track"><span class="toggle-knob"></span></span>
          </label>
        </div>
        <div id="timeField" class="time-field" hidden>
          <input type="time" id="timeInput" value="09:00">
        </div>

        <p class="field-label">카테고리</p>
        <div class="category-chips" id="categoryChips">
          <button type="button" class="chip chip-work selected" data-category="업무">업무</button>
          <button type="button" class="chip chip-personal" data-category="개인">개인</button>
          <button type="button" class="chip chip-exercise" data-category="운동">운동</button>
          <button type="button" class="chip chip-growth" data-category="개인성장">개인성장</button>
        </div>

        <button type="submit" class="submit-btn">추가하기</button>
      </form>
    </aside>
  </div>

  <script type="module" src="script.js?v=9"></script>
</body>
</html>
