name: Validate Haliljang voice input
on:
  pull_request:
    paths:
      - 'index.html'
      - 'script.js'
      - 'bridge/**'
      - '.github/workflows/chatgpt-validation.yml'
  push:
    branches:
      - 'feature/chatgpt-voice-safe-integration'
    paths:
      - 'index.html'
      - 'script.js'
      - 'bridge/**'
      - '.github/workflows/chatgpt-validation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check script.js
          node --check bridge/parser.mjs
      - name: Korean voice date/time parser tests (no Firestore writes)
        run: node --test bridge/test/parser.test.cjs
