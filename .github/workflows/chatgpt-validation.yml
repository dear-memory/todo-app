name: Validate ChatGPT task integration
on:
  pull_request:
    paths:
      - 'functions/**'
      - '.github/workflows/chatgpt-validation.yml'
  push:
    branches:
      - 'feature/chatgpt-voice-safe-integration'
    paths:
      - 'functions/**'
      - '.github/workflows/chatgpt-validation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check functions/validation.js
          node --check functions/index.js
      - name: Validate task inputs
        run: node --test functions/test/validation.test.js
