name: Android APK (할일장)

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install SDK packages
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK
        run: gradle --no-daemon :android:assembleDebug
      - name: Name installable APK
        run: cp android/build/outputs/apk/debug/android-debug.apk haliljang-android-v1.0.0.apk
      - name: Save workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: haliljang-android-v1.0.0
          path: haliljang-android-v1.0.0.apk
          retention-days: 90
      - name: Publish downloadable APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.0-preview
          name: 할일장 안드로이드 APK v1.0.0 (미리보기)
          body: |
            기존 할일장 홈페이지와 Firebase 계정을 그대로 사용하는 안드로이드 앱입니다.
            기존 할 일 데이터는 변경하지 않으며, 설치 후 기존 계정으로 로그인하세요.
            인터넷 연결이 필요합니다.
            이 APK는 테스트용 디버그 서명으로 빌드되었습니다. 정식 배포/Play스토어 서명판이 아닙니다.
          files: haliljang-android-v1.0.0.apk
          fail_on_unmatched_files: true
          draft: false
          prerelease: true
