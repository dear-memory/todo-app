<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101828">
  <title>할일장 — 음성 입력</title>
  <style>
    *{box-sizing:border-box} body{margin:0;background:#f8fafc;color:#101828;font-family:system-ui,"Noto Sans KR",sans-serif;line-height:1.5}
    main{max-width:560px;margin:24px auto;padding:20px}
    h1{font-size:29px;letter-spacing:-.04em;margin:0 0 6px}
    .muted{color:#667085;font-size:14px;margin:0 0 24px}
    section{padding:22px;border:1px solid #e4e7ec;border-radius:18px;background:white;box-shadow:0 5px 30px rgba(16,24,40,.05)}
    label{display:block;margin:14px 0 7px;font-size:14px;font-weight:600}
    input,textarea,select{font:inherit;width:100%;border:1px solid #d0d5dd;border-radius:10px;padding:12px;background:white;color:#101828}
    textarea{resize:vertical;min-height:78px}
    button{font:inherit;background:#101828;color:white;border:0;border-radius:12px;padding:12px 16px;cursor:pointer}
    button.secondary{background:#eaecf0;color:#101828}
    button:disabled{opacity:.4;cursor:wait}
    .row{display:flex;gap:12px;align-items:center}
    .row>*{flex:1}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    #micBtn{width:100%;padding:20px;margin-top:16px;font-size:20px}
    #notice{padding:12px;background:#f2f4f7;border-radius:10px;margin:16px 0;word-break:keep-all}
    .switch{display:flex;gap:10px;align-items:center;font-weight:normal}
    .switch input{width:18px;height:18px;margin:0}
    .hidden{display:none!important}
    .foot{font-size:13px;color:#667085;margin-top:20px}
  </style>
</head>
<body>
<main>
  <h1>할일장 <span aria-hidden="true">🎙️</span></h1>
  <p class="muted">기존 기록은 그대로 두고, 새로운 할 일만 따로 저장합니다.</p>

  <section id="loginSection">
    <h2>할일장 계정 로그인</h2>
    <p class="muted">기존 할일장에서 쓰는 이메일과 비밀번호로 로그인하세요. 비밀번호는 Firebase로만 전송합니다.</p>
    <form id="loginForm">
      <label for="email">이메일</label><input id="email" type="email" autocomplete="email" required>
      <label for="password">비밀번호</label><input id="password" type="password" autocomplete="current-password" required>
      <button type="submit" style="width:100%;margin-top:18px">로그인</button>
    </form>
  </section>

  <section id="voiceSection" class="hidden">
    <div class="row">
      <span id="loggedInAs" class="muted" style="margin:0"></span>
      <button type="button" id="logoutBtn" class="secondary">로그아웃</button>
    </div>
    <button type="button" id="micBtn">🎙️ 누르고 말하기</button>
    <label class="switch"><input id="autosave" type="checkbox" checked> 음성 인식이 끝나면 자동 저장</label>
    <label for="transcript">말한 내용 (수정할 수도 있어요)</label>
    <textarea id="transcript" placeholder="내일 오후 3시 사진 보정 추가해 줘"></textarea>
    <div class="grid">
      <div><label for="taskDate">날짜</label><input id="taskDate" type="date"></div>
      <div><label for="taskTime">시간 (선택)</label><input id="taskTime" type="time"></div>
    </div>
    <label for="taskTitle">할 일 제목</label>
    <input id="taskTitle" placeholder="사진 보정" maxlength="160">
    <label for="category">카테고리</label>
    <select id="category"><option>업무</option><option>개인</option><option>운동</option><option>개인성장</option></select>
    <button type="button" id="saveBtn" style="width:100%;margin-top:18px">새 할 일 저장</button>
    <hr style="border:0;border-top:1px solid #eaecf0;margin:24px 0">
    <h3 style="margin-bottom:8px">이 페이지에서 추가된 할 일</h3>
    <p class="muted">기존 기록을 수정하지 않고 새로 추가된 항목만 표시합니다.</p>
    <ul id="recentTasks" aria-live="polite" style="padding-left:22px"></ul>
  </section>

  <p id="notice" role="status" aria-live="polite">기존 할일장 자료는 수정되지 않습니다.</p>
  <p class="foot">음성 인식은 지원되는 브라우저에서만 작동합니다. 지원하지 않는 경우 문장을 직접 입력해 저장하세요. 서비스 배포 및 Firebase 규칙 등록 전에는 저장이 작동하지 않습니다.</p>
</main>
<script type="module" src="./voice.js"></script>
</body>
</html>
